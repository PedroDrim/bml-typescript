name: Run Docker with Tests (Bun + Node)

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  test:
    name: 🧪 Run Tests with Bun
    runs-on: ubuntu-latest

    steps:
      - name: 🚗 Checkout do código
        uses: actions/checkout@v4

      - name: 🏗️ Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Instalar dependências
        run: bun install

      - name: 🌍 Instalar `nyc` globalmente
        run: npm install -g nyc

      - name: 📊 Executar testes com cobertura
        run: nyc --reporter=lcov bun test

      - name: 📤 Upload da cobertura de testes
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-de-testes
          path: coverage/

  docker:
    name: 🐳 Build & Run Docker
    runs-on: ubuntu-latest
    needs: test  # Só executa se os testes passarem

    steps:
      - name: 🚀 Checkout do código
        uses: actions/checkout@v4

      - name: 🏗️ Build da imagem Docker
        run: docker compose up --build -d

      - name: 🏃 Rodar o container
        run: docker compose run --rm benchmark | tee benchmark_output.log

      - name: 📤 Publicar resultado como artefato
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-result
          path: benchmark_output.log      
      
      - name: 🔻 Derrubar containers no final
        if: always()
        run: docker compose down
